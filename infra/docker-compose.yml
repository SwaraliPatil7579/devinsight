version: "3.8"

services:
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: devinsight_db
    environment:
      POSTGRES_USER: devinsight
      POSTGRES_PASSWORD: devinsight123
      POSTGRES_DB: devinsight
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: devinsight_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
